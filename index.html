<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
          <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" />

    <!-- iOS: metti PRIMA quello con sizes, poi il fallback senza -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
    <title>FLEOFIT</title>

    <!-- 🔴 IL FONDO SCURO STA QUI, IN LINEA, E NON SOLO IN index.css.
         Misurato il 22/09/2026 registrando l'avvio sul simulatore: fra lo
         schermo di lancio e l'app c'erano **380ms di BIANCO PIENO**. È la
         webview che dipinge il proprio fondo prima che il foglio di stile sia
         stato scaricato e applicato — su un'app tutta scura è un flash in
         faccia. Una regola in `src/index.css` non basta: quel file arriva
         DOPO. Questa invece è già nel documento. -->
    <style>
      html, body { background-color: #0B0B0B; }

      /* 🔴 IL PRIMO FOTOGRAMMA DELL'APERTURA, DIPINTO PRIMA DI REACT.
         Misurato il 22/09/2026 sul simulatore: dall'apertura dell'app alle
         prime forme passavano 1,7 secondi di nero, perché l'apertura non può
         cominciare prima che la webview si sia avviata, il bundle sia stato
         scaricato e React abbia montato. Questo blocco invece è già nel
         documento: si dipinge appena l'HTML viene letto.

         ⚠️ STA DENTRO #root DI PROPOSITO: `createRoot().render()` svuota il
         contenitore al primo render, quindi il pre-disegno se ne va da solo
         nell'istante in cui React prende il posto. Fuori da #root resterebbe
         in pagina per sempre.

         🔴 È UNA COPIA di `.apertura` e del marchio in src/components/
         Apertura.jsx, e la copia è inevitabile: il foglio di stile e il bundle
         arrivano DOPO, quindi qui non si può usare né Tailwind né una classe.
         Il gradiente deve restare identico a quello di src/index.css o al
         passaggio di consegne si vede uno scalino di colore — c'è un test che
         confronta i due file.

         ⚠️ Il carattere è quello di sistema (src/index.css riga ~74: Inter era
         dichiarato ma non caricato), quindi qui NON serve precaricare niente e
         il marchio è identico prima e dopo. Se un giorno si aggiunge un web
         font, questo pre-disegno va precaricato o il logo cambierà forma a
         metà apertura. */
      #apertura-prima {
        position: fixed; inset: 0; z-index: 200;
        background: radial-gradient(120% 88% at 32% 34%, #2b2210 0%, #16130b 45%, #0B0B0B 100%);
        display: flex; align-items: center; justify-content: center;
      }
      #apertura-prima h1 {
        margin: 0; font-size: 44px; line-height: 1; font-weight: 900;
        letter-spacing: -.03em; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, system-ui, sans-serif;
      }
      #apertura-prima span { color: #f1ba17; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Il pre-disegno. React lo sostituisce montando <Apertura>, che riprende
           esattamente da qui. Vedi lo <style> qui sopra. -->
      <div id="apertura-prima"><h1>FLEO<span>FIT</span></h1></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
