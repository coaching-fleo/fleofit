name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Export tables via Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          mkdir -p backup
          TABLES=("athletes" "athlete_photos" "athlete_workouts" "workouts" "workout_logs")
          for TABLE in "${TABLES[@]}"; do
            curl -s \
              -H "apikey: $SUPABASE_SERVICE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              "$SUPABASE_URL/rest/v1/$TABLE?select=*" \
              -o "backup/$TABLE.json"
            echo "Exported $TABLE"
          done
          zip -r "backup_$(date +%Y-%m-%d).zip" backup/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_number }}
          path: backup_*.zip
          retention-days: 90
