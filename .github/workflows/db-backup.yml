name: Daily Supabase Backup

on:
  schedule:
    - cron: '0 2 * * *'   # Every day at 02:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python & gdrive deps
        run: pip install google-api-python-client google-auth

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          FILENAME="backup_$(date +%Y-%m-%d_%H-%M-%S).sql.gz"
          pg_dump "$DATABASE_URL" | gzip > "$FILENAME"
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV

      - name: Upload to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_SERVICE_ACCOUNT" > /tmp/sa.json
          python3 - <<'EOF'
          import os
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2 import service_account

          creds = service_account.Credentials.from_service_account_file(
              "/tmp/sa.json",
              scopes=["https://www.googleapis.com/auth/drive"]
          )
          service = build("drive", "v3", credentials=creds)

          filename = os.environ["FILENAME"]
          folder_id = os.environ["GDRIVE_FOLDER_ID"]

          file_metadata = {
              "name": filename,
              "parents": [folder_id]
          }
          media = MediaFileUpload(filename, mimetype="application/gzip")
          service.files().create(
              body=file_metadata,
              media_body=media,
              supportsAllDrives=True,        # <-- aggiunto
              fields="id"
          ).execute()
          print(f"Uploaded {filename} to Google Drive ✓")
          EOF
      - name: Cleanup old backups (keep last 7)
        env:
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "$GDRIVE_SERVICE_ACCOUNT" > /tmp/sa.json
          python3 - <<'EOF'
          import os
          from googleapiclient.discovery import build
          from google.oauth2 import service_account

          creds = service_account.Credentials.from_service_account_file(
              "/tmp/sa.json",
              scopes=["https://www.googleapis.com/auth/drive"]
          )
          service = build("drive", "v3", credentials=creds)
          folder_id = os.environ["GDRIVE_FOLDER_ID"]

          results = service.files().list(
              q=f"'{folder_id}' in parents and trashed=false",
              orderBy="createdTime",
              fields="files(id, name, createdTime)"
          ).execute()

          files = results.get("files", [])
          to_delete = files[:-7]  # keep newest 7
          for f in to_delete:
              service.files().delete(fileId=f["id"]).execute()
              print(f"Deleted old backup: {f['name']}")
          EOF
